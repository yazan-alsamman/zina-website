# /etc/nginx/conf.d/zina-brotli.conf: installed only when the brotli module is available
# (Ubuntu 24.04: libnginx-mod-http-brotli-filter).
brotli on;
brotli_comp_level 5;
brotli_min_length 1024;
brotli_types text/plain text/css text/xml application/javascript application/json
             application/xml application/rss+xml application/manifest+json image/svg+xml
             text/x-component;
