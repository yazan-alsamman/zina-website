# /etc/nginx/conf.d/zina-compression.conf (http level). The Next.js server's own compression is
# off (next.config.ts): Nginx compresses instead (gzip here, brotli in zina-brotli.conf).
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css text/xml application/javascript application/json
           application/xml application/rss+xml application/manifest+json image/svg+xml
           text/x-component;
