# /etc/nginx/snippets/zina-headers.conf: security headers for every response of the site.
# Nginx does not inherit add_header into a location that sets its own, so such locations include
# this file again.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "DENY" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Next.js streams inline bootstrap scripts and the 3D scene sets inline styles, so 'unsafe-inline'
# is needed while pages stay static (a nonce would make every page dynamic); the scene's workers
# load their code from blob: URLs. Everything else is self-hosted; WhatsApp is only a link or a
# redirect target. Tested with Playwright on every public page and the admin sign-in.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' blob:; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; frame-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self' https://wa.me https://api.whatsapp.com; upgrade-insecure-requests" always;
