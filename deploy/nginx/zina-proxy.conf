# /etc/nginx/snippets/zina-proxy.conf: proxy to the Next.js server (upstream zina_app).
proxy_pass http://zina_app;
proxy_http_version 1.1;
proxy_set_header Host $host;
# The app trusts X-Real-IP for the login rate limiter: it must always be set here.
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port $server_port;
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $zina_connection_upgrade;
# Try the standby only when the app refuses the connection (it is restarting).
proxy_next_upstream error timeout;
proxy_next_upstream_tries 2;
proxy_connect_timeout 5s;
proxy_read_timeout 120s;
# Next.js sends large headers (RSC payload hints, cache tags).
proxy_buffer_size 32k;
proxy_buffers 16 32k;
proxy_busy_buffers_size 64k;
