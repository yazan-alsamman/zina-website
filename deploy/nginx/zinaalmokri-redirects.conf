# Final domain switch (deploy/README.md): www. and new. redirect to the apex. Installed as
# /etc/nginx/sites-available/zinaalmokri-redirects.conf with __APEX__ = zinaalmokri.com, next to
# zinaalmokri.conf installed with __DOMAIN__ = zinaalmokri.com. One certificate covers the three
# names (certbot certonly --nginx -d zinaalmokri.com -d www.zinaalmokri.com -d new.zinaalmokri.com).
server {
    listen 80;
    listen [::]:80;
    server_name www.__APEX__ new.__APEX__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://__APEX__$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.__APEX__ new.__APEX__;

    ssl_certificate     /etc/letsencrypt/live/__APEX__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__APEX__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    server_tokens off;

    add_header Strict-Transport-Security "max-age=31536000" always;
    return 301 https://__APEX__$request_uri;
}
