# Zina Al Mokri: Nginx site template (deploy/README.md).
# Installed as /etc/nginx/sites-available/zinaalmokri.conf with __DOMAIN__ replaced by the
# host that serves the site (first new.zinaalmokri.com, later zinaalmokri.com).
# Needs: snippets/zina-headers.conf, snippets/zina-proxy.conf, conf.d/zina-compression.conf,
# and a certificate for __DOMAIN__ in /etc/letsencrypt/live/__DOMAIN__/.

# The app on :3000; during a deploy the standby on :3001 answers while :3000 restarts.
upstream zina_app {
    server 127.0.0.1:3000 max_fails=1 fail_timeout=3s;
    server 127.0.0.1:3001 backup;
    keepalive 16;
}

map $http_upgrade $zina_connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Product photos go through the admin upload (15 MB images plus form overhead).
    client_max_body_size 20m;
    server_tokens off;

    access_log /var/log/nginx/zina.access.log;
    error_log  /var/log/nginx/zina.error.log warn;

    include snippets/zina-headers.conf;

    # Never serve env files, VCS folders or any other dotfile (ACME challenges are on port 80).
    location ~ /\. {
        return 404;
    }

    # Build assets: content-hashed file names. Every release's chunks accumulate in
    # shared/assets, so open pages keep working across deploys; anything else goes to the app.
    location ^~ /_next/static/ {
        root /var/www/zina/shared/assets;
        include snippets/zina-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;
        try_files $uri @app;
    }

    # Uploaded media straight from disk (UPLOAD_DIR); names never change.
    location ^~ /media/ {
        alias /var/www/zina/shared/storage/uploads/;
        autoindex off;
        try_files $uri =404;
        types {
            image/avif avif;
            image/webp webp;
            image/jpeg jpg jpeg;
            image/png png;
            image/svg+xml svg;
        }
        default_type application/octet-stream;
        include snippets/zina-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        access_log off;

        # An SVG opened on its own must not run anything.
        location ~* \.svg$ {
            include snippets/zina-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        }
    }

    location / {
        include snippets/zina-proxy.conf;
    }

    location @app {
        include snippets/zina-proxy.conf;
    }
}
