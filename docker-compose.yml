# Local development database. Credentials are for local use only.
# Set POSTGRES_PORT in .env if 5432 is already taken on your machine.
services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zina}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zina}
      POSTGRES_DB: ${POSTGRES_DB:-zina}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - zina-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  zina-pgdata:
